name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python files
        run: python -m compileall -q poe_truss desktop tests
      - name: Regression tests
        run: python -m pytest -q -rs tests

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:BUILD_PYTHON = (Get-Command python).Source
          .\BUILD_EXE_WINDOWS.bat
          exit $LASTEXITCODE
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/2DTruss_v0.1/2DTruss_v0.1.exe'
          $env:TRUSS_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP '2dtruss-smoke.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($process.ExitCode -ne 0 -and (Test-Path -LiteralPath $env:TRUSS_SMOKE_REPORT)) {
            Get-Content -LiteralPath $env:TRUSS_SMOKE_REPORT
          }
          exit $process.ExitCode
